[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resq-command"
version = "0.1.0"
description = "ResQVision Command: Tactical Ground Station & Autonomous Emergency Response Controller"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ResQVision Team" }
]
keywords = ["pyside6", "tactical", "ground-station", "drone", "first-responder", "jarvis"]

dependencies = [
    "PySide6>=6.5.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "websockets>=12.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
resq-command = "resq_command.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["resq_command*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]