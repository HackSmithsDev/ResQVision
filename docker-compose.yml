services:
  ollama:
    image: ollama/ollama:latest
    container_name: resq_ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
      - ./resq_cloud/ollama/Modelfile:/etc/ollama/Modelfile:ro
      - ./resq_cloud/ollama/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11434/api/tags > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - resq_network
    restart: unless-stopped

  api:
    build:
      context: ./resq_cloud
      dockerfile: Dockerfile
    container_name: resq_api
    env_file:
      - ./resq_cloud/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8084
      DEBUG: "false"
      ENVIRONMENT: production
      WORKERS_COUNT: 1
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: resq-tactical:latest
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/docs', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - resq_network
    restart: unless-stopped

  worker:
    build:
      context: ./resq_cloud
      dockerfile: Dockerfile
    container_name: resq_worker
    env_file:
      - ./resq_cloud/.env
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - resq_network
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    container_name: resq_tunnel
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in root .env}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - resq_network
    restart: unless-stopped

volumes:
  ollama_storage:
    driver: local

networks:
  resq_network:
    driver: bridge